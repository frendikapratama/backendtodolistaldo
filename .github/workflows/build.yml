name: Build & Push Backend Planify

on:
  push:
    branches: [memberWorkspace]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/frendikapratama/backendtodolistaldo:${{ github.sha }}
            ghcr.io/frendikapratama/backendtodolistaldo:0.1.31